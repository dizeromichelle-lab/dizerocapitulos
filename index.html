
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dizero | Capítulos</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #111;
}

.fundo {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.conteudo {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  background: rgba(0,0,0,0.12);
}

.capitulos {
  width: min(100%, 1100px);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px 48px;
}

.capitulos a {
  color: white;
  text-decoration: none;
  font-size: clamp(13px, 1.5vw, 19px);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 0 1px 5px rgba(0,0,0,.7);
}

.capitulos a:hover {
  text-decoration: underline;
}

@media (max-width: 600px) {
  .conteudo { padding: 24px 18px; }
  .capitulos { gap: 22px 16px; }
  .capitulos a { font-size: 12px; }
}
</style>
</head>
